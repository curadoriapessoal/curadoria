 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Editing Pro</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://accounts.google.com/gsi/client" onload="initTokenClient()" async defer></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>
    
    <style>
        /* Layout Principal */
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            height: 100vh;
            width: 100vw;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-top: 2vh; 
        }

        #auth_button { 
            padding: 20px 40px; 
            background: #fff; 
            border: none;
            border-radius: 50px; 
            font-weight: bold;
            cursor: pointer;
            color: #000;
            box-shadow: 0 6px 0 #ccc, 0 10px 15px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            text-transform: uppercase;
            margin-top: 30vh; 
            position: relative;
            z-index: 999999;
        }
        #auth_button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #ccc, 0 4px 6px rgba(0,0,0,0.5);
        }

        /* ---------------------------------------------------
           NAVEGAÇÃO DE PASTAS (TOP BAR)
           --------------------------------------------------- */
        #folder-nav {
            width: 100%;
            display: none; 
            justify-content: center;
            align-items: center; 
            gap: 6px; 
            padding: 5px 10px;
            z-index: 1001;
            flex-wrap: wrap; 
            box-sizing: border-box;
        }

        .folder-tab {
            background: #222;
            color: #888;
            border: 1px solid #444;
            padding: 8px 12px; 
            border-radius: 20px;
            font-size: 0.75rem; 
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            white-space: nowrap; 
        }

        .folder-tab.active {
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Estilo específico para a lixeira */
        .btn-trash {
            background: transparent;
            border-color: rgba(220, 53, 69, 0.5); 
            font-size: 1rem;
            padding: 5px 10px;
        }
        .btn-trash:hover {
            background: rgba(220, 53, 69, 0.2);
            border-color: #dc3545;
        }

        /* ---------------------------------------------------
           CABEÇALHO (CONTADOR DISCRETO)
           --------------------------------------------------- */
        #info-bar {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center; 
            padding: 5px 0;
            z-index: 1000;
            pointer-events: none;
        }

        #photo-count {
            font-size: 1.2rem; 
            font-weight: bold;
            color: #aaa;
            text-shadow: 0 1px 3px rgba(0,0,0,1);
            display: none; 
        }

        /* ---------------------------------------------------
           CONTAINER DE FOTOS
           --------------------------------------------------- */
        #catalog-container { 
            position: relative; 
            width: 95vw; 
            height: 58vh; 
            margin-top: 1vh; 
            display: none;
            transition: opacity 0.3s ease; 
        }

        @media (min-width: 768px) {
            #catalog-container { width: 50vw; }
        }

        .card { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: transparent; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out; 
        }

        .card img { 
            max-width: 100%; 
            max-height: 100%; 
            width: auto;
            height: auto;
            object-fit: contain; 
            pointer-events: none;
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
        }

        /* Zonas de Toque Laterais Invisíveis */
        .nav-zone {
            position: absolute;
            top: 0; bottom: 0;
            width: 35%; 
            display: none; 
            align-items: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 500000; 
            transition: background 0.2s ease, color 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #nav-left { 
            left: 0; justify-content: flex-start; padding-left: 15px; 
            background: linear-gradient(to right, rgba(0,0,0,0.3), transparent);
        }
        #nav-right { 
            right: 0; justify-content: flex-end; padding-right: 15px; 
            background: linear-gradient(to left, rgba(0,0,0,0.3), transparent);
        }

        .nav-zone:active { color: rgba(255,255,255,1); background: rgba(255,255,255,0.1); }

        /* ---------------------------------------------------
           BOTÃO ZONA DE PERIGO (Longe dos controles)
           --------------------------------------------------- */
        #danger-zone {
            display: none; 
            position: absolute;
            bottom: 22vh; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        #btn-empty-curadoria {
            background: rgba(220, 53, 69, 0.05);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: rgba(220, 53, 69, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        #btn-empty-curadoria:hover {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border-color: #dc3545;
        }

        /* ---------------------------------------------------
           MODAL DE CONFIRMAÇÃO (POPUP)
           --------------------------------------------------- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 9999999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #111;
            border: 1px solid #dc3545;
            padding: 25px;
            border-radius: 15px;
            width: 85vw;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(220, 53, 69, 0.3);
            font-family: sans-serif;
        }

        .modal-content h3 { color: #dc3545; margin-top: 0; font-size: 1.2rem;}
        .modal-content p { color: #ccc; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
        
        .checkbox-container {
            display: flex; align-items: flex-start; gap: 10px;
            text-align: left; font-size: 0.85rem; color: #fff;
            background: #222; padding: 12px; border-radius: 8px; margin-bottom: 25px;
            cursor: pointer;
        }

        .checkbox-container input { margin-top: 2px; accent-color: #dc3545; width: 18px; height: 18px; }
        
        .modal-actions { display: flex; gap: 10px; justify-content: space-between; }
        
        .btn-cancel, .btn-confirm {
            flex: 1; padding: 12px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.8rem;
        }
        
        .btn-cancel { background: #444; color: #fff; }
        .btn-confirm { background: #dc3545; color: #fff; opacity: 0.4; cursor: not-allowed; transition: all 0.2s;}
        .btn-confirm.enabled { opacity: 1; cursor: pointer; box-shadow: 0 0 15px rgba(220, 53, 69, 0.4); }

        /* ---------------------------------------------------
           LAYOUT INFERIOR (BOTÕES DE AÇÃO)
           --------------------------------------------------- */
        #bottom-area {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 25px); 
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px; 
            z-index: 999999;
            pointer-events: none; 
        }

        #controls-wrapper {
            display: none; 
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px;
            pointer-events: none;
        }

        .left-panel { display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .right-panel { display: flex; flex-direction: row; gap: 10px; pointer-events: auto; }

        .solid-btn {
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            touch-action: manipulation;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .solid-btn:active { transform: scale(0.96) translateY(2px); }

        .btn-left-stack { width: 130px; height: 46px; border-radius: 12px; font-size: 0.8rem; letter-spacing: 0.5px; }
        
        .btn-undo { border-color: rgba(255, 193, 7, 0.2); box-shadow: 0 4px 15px rgba(255, 193, 7, 0.1); visibility: hidden; }
        .btn-sync { border-color: rgba(232, 62, 140, 0.2); box-shadow: 0 4px 15px rgba(232, 62, 140, 0.1); }

        .btn-right-action { width: 65px; height: 104px; flex-direction: column; border-radius: 16px; font-size: 0.65rem; gap: 8px; }
        .btn-right-action .icon { font-size: 1.4rem; }
        
        .btn-reject { border-color: rgba(220, 53, 69, 0.2); box-shadow: 0 4px 15px rgba(220, 53, 69, 0.1); }
        .btn-manter { border-color: rgba(13, 110, 253, 0.2); box-shadow: 0 4px 15px rgba(13, 110, 253, 0.1); }
        .btn-top { border-color: rgba(40, 167, 69, 0.2); box-shadow: 0 4px 15px rgba(40, 167, 69, 0.1); }

        /* Botão Ocultar Tela */
        #hide-strip { display: none; justify-content: center; width: 100%; pointer-events: none; }
        #hide-btn { background: rgba(128, 128, 128, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 10px 25px; border-radius: 25px; font-size: 0.8rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; text-transform: uppercase; }

        #end-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; display: none; flex-direction: column; align-items: center; gap: 20px; z-index: 0; }
        #empty-message { font-size: 1.2rem; color: #888; text-align: center; margin-bottom: 10px;}

    </style>
</head>
<body>

    <button id="auth_button" onclick="handleAuthClick()">ABRIR PASTA</button>

    <div id="folder-nav">
        <button class="folder-tab btn-trash" onclick="emptyRejectFolder()" id="tab-trash" title="Esvaziar pasta Reject">🗑️</button>
        
        <button class="folder-tab active" onclick="switchFolder('source')" id="tab-source">Origem</button>
        <button class="folder-tab" onclick="switchFolder('manter')" id="tab-manter">Manter</button>
        <button class="folder-tab" onclick="switchFolder('top')" id="tab-top">Top</button>

        <button id="btn-sort" class="folder-tab" onclick="toggleSortOrder()">🔤 A-Z</button>
    </div>
    
    <div id="info-bar">
        <div id="photo-count">...</div>
    </div>

    <div id="catalog-container">
        <div id="nav-left" class="nav-zone" onclick="prevPhoto()">&#10094;</div>
        <div id="nav-right" class="nav-zone" onclick="nextPhoto()">&#10095;</div>

        <div id="end-screen">
            <div id="empty-message">A pasta está vazia!</div>
        </div>
    </div>

    <div id="danger-zone">
        <button id="btn-empty-curadoria" onclick="openCuradoriaModal()">Esvaziar Curadoria</button>
    </div>

    <div id="bottom-area">
        <div id="controls-wrapper">
            <div class="left-panel">
                <button id="undo_button" class="solid-btn btn-left-stack btn-undo" onclick="undoLastAction()">↩ VOLTAR</button>
                <button class="solid-btn btn-left-stack btn-sync" onclick="reloadFolder()">🔄 SINCRONIZAR</button>
            </div>
            
            <div class="right-panel">
                <button class="solid-btn btn-right-action btn-reject" onclick="handleGlobalAction(1)">
                    <span class="icon">🏴</span> REJECT
                </button>
                <button class="solid-btn btn-right-action btn-manter" onclick="handleGlobalAction(3)">
                    <span class="icon">📁</span> MANTER
                </button>
                <button class="solid-btn btn-right-action btn-top" onclick="handleGlobalAction(5)">
                    <span class="icon">🏳️</span> TOP
                </button>
            </div>
        </div>

        <div id="hide-strip">
            <button id="hide-btn" onclick="toggleVisibility()">OCULTAR TELA</button>
        </div>
    </div>

    <div id="curadoria-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>⚠️ ATENÇÃO EXTREMA ⚠️</h3>
            <p>Você está prestes a enviar <b>TODOS</b> os arquivos da pasta <b>Curadoria (Origem)</b> para a Lixeira do seu Google Drive.</p>
            
            <label class="checkbox-container">
                <input type="checkbox" id="confirm-checkbox" onchange="toggleConfirmButton()">
                Eu entendo que esta ação apagará as fotos em lote e não poderá ser desfeita por aqui.
            </label>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCuradoriaModal()">CANCELAR</button>
                <button id="btn-confirm-delete" class="btn-confirm" onclick="executeEmptyCuradoria()" disabled>EXCLUIR TUDO</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        const CLIENT_ID = '905891014579-fjgqvkgbiucl4c0asn68pbv1p5gm6ofn.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive'; 
        
        const FOLDERS = {
            'source': '1l5c1yWkNJWI3NIKp_6Fnxs56nzc44P6F',
            1: '1UL8zEJGWWH2A1NEt-pUhRDQ9sTj9KI6w', // Reject
            3: '1HDf3BCTUulwYA_IdF2AlTmZcy_TyO19x', // Manter
            5: '1uHGn2rpZJj68QSe0EVJNh8JCXl7oiKoh'  // Top
        };

        let activeFolderKey = 'source'; 
        let tokenClient;
        let gapiInited = false;
        let gsisInited = false;
        let nextPageToken = null;
        let isFetching = false;
        let undoZIndex = 200000; 
        
        const processedIds = new Set(); 
        let actionHistory = []; 
        let totalPhotosInFolder = 0; 
        let currentViewIndex = 0;
        let isScreenHidden = false;
        let currentSortOrder = 'name'; 

        // ----- VARIÁVEIS PARA CONTROLE DE INATIVIDADE -----
        let inactivityTimer = null;
        const INACTIVITY_DELAY = 5000; // 5 segundos

        function gapiLoaded() { 
            gapi.load('client', () => {
                gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] })
                .then(() => { gapiInited = true; maybeEnableButtons(); })
                .catch(err => console.error("Erro GAPI", err));
            });
        }

        function initTokenClient() {
            // CORREÇÃO: O callback não pode ser uma string vazia, deve ser uma função
            tokenClient = google.accounts.oauth2.initTokenClient({ 
                client_id: CLIENT_ID, 
                scope: SCOPES, 
                callback: (resp) => {} 
            });
            gsisInited = true;
            maybeEnableButtons();
        }

        function maybeEnableButtons() {
            if (gapiInited && gsisInited) {
                document.getElementById('auth_button').style.display = 'block';
            }
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error) {
                    console.error("Erro na autenticação:", resp);
                    return;
                }
                
                document.getElementById('auth_button').style.display = 'none';
                document.getElementById('folder-nav').style.display = 'flex';
                document.getElementById('catalog-container').style.display = 'block';
                document.getElementById('controls-wrapper').style.display = 'flex'; 
                document.getElementById('hide-strip').style.display = 'flex'; 
                document.getElementById('photo-count').style.display = 'block'; 
                document.getElementById('danger-zone').style.display = 'block'; 
                
                loadActiveFolder();
                resetInactivityTimer(); // Inicia o monitoramento após login
            };
            tokenClient.requestAccessToken(); 
        }

        // ----- FUNÇÕES DE CONTROLE DE VISIBILIDADE E INATIVIDADE -----
        function hideImageArea() {
            const container = document.getElementById('catalog-container');
            if (container) {
                isScreenHidden = true;
                container.style.opacity = '0.01';
            }
        }

        function showImageArea() {
            const container = document.getElementById('catalog-container');
            if (container) {
                isScreenHidden = false;
                container.style.opacity = '1';
            }
        }

        function toggleVisibility() {
            if (isScreenHidden) {
                showImageArea();
                resetInactivityTimer();
            } else {
                hideImageArea();
                clearTimeout(inactivityTimer); 
            }
        }

        function resetInactivityTimer() {
            try {
                if (isScreenHidden) {
                    showImageArea();
                }
                
                clearTimeout(inactivityTimer);
                
                const authBtn = document.getElementById('auth_button');
                // Só arma o timer se o botão de login já sumiu (usuário logado)
                if (authBtn && authBtn.style.display === 'none') {
                    inactivityTimer = setTimeout(hideImageArea, INACTIVITY_DELAY);
                }
            } catch (e) {
                console.error("Erro no temporizador:", e);
            }
        }

        // Adiciona os ouvintes de evento de forma passiva (não bloqueiam a thread principal)
        window.addEventListener('DOMContentLoaded', () => {
            ['mousemove', 'mousedown', 'touchstart', 'touchmove', 'keydown'].forEach(evt => {
                document.addEventListener(evt, resetInactivityTimer, { passive: true });
            });
        });
        // -------------------------------------------------------------

        function switchFolder(folderKey) {
            if (activeFolderKey === folderKey) return; 

            document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + folderKey).classList.add('active');

            activeFolderKey = folderKey;
            
            document.getElementById('danger-zone').style.display = (folderKey === 'source') ? 'block' : 'none';

            loadActiveFolder();
        }

        function loadActiveFolder() {
            const container = document.getElementById('catalog-container');
            container.querySelectorAll('.card').forEach(c => c.remove());
            
            nextPageToken = null; 
            currentViewIndex = 0;
            processedIds.clear();
            actionHistory = []; 
            updateUndoButtonState();
            
            document.getElementById('end-screen').style.display = 'none'; 
            fetchTotalCount();
            listPhotos();
        }

        function getVisibleCards() {
            return Array.from(document.querySelectorAll('.card:not(.animating)'));
        }

        function getActiveCard() {
            const cards = getVisibleCards();
            return cards[currentViewIndex] || null;
        }

        function updateCardsVisibility() {
            const cards = getVisibleCards();
            const navLeft = document.getElementById('nav-left');
            const navRight = document.getElementById('nav-right');

            if(cards.length === 0) {
                navLeft.style.display = 'none';
                navRight.style.display = 'none';
                return;
            }
            
            if (currentViewIndex >= cards.length) currentViewIndex = Math.max(0, cards.length - 1);
            if (currentViewIndex < 0) currentViewIndex = 0;

            cards.forEach((card, index) => {
                if (index === currentViewIndex) {
                    card.style.visibility = 'visible';
                    card.style.opacity = '1';
                } else {
                    card.style.visibility = 'hidden';
                    card.style.opacity = '0';
                }
            });

            navLeft.style.display = currentViewIndex > 0 ? 'flex' : 'none';
            navRight.style.display = (currentViewIndex < cards.length - 1 || nextPageToken) ? 'flex' : 'none';
        }

        function prevPhoto() {
            if (currentViewIndex > 0) {
                currentViewIndex--;
                updateCardsVisibility();
            }
        }

        function nextPhoto() {
            const cards = getVisibleCards();
            if (currentViewIndex < cards.length - 1) {
                currentViewIndex++;
                updateCardsVisibility();
            } else if (nextPageToken) {
                listPhotos(); 
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.repeat) return; 

            switch(event.key) {
                case 'ArrowLeft': prevPhoto(); break;
                case 'ArrowRight': nextPhoto(); break;
                case 's': case 'S': case '4': handleGlobalAction(1); break; 
                case 'd': case 'D': case '5': handleGlobalAction(3); break; 
                case 'f': case 'F': case '6': handleGlobalAction(5); break; 
                case 'a': case 'A': case '2': reloadFolder(); break; 
                case 'r': case 'R': case '1': undoLastAction(); break; 
                case 'g': case 'G': case '3': emptyRejectFolder(); break; 
                case '7': switchFolder('source'); break; 
                case '8': switchFolder('manter'); break; 
                case '9': switchFolder('top'); break;    
                case '+': toggleSortOrder(); break; 
                case '0': toggleVisibility(); break; 
            }
        });

        function toggleSortOrder() {
            const btn = document.getElementById('btn-sort');
            if (currentSortOrder === 'name') {
                currentSortOrder = 'createdTime desc'; 
                btn.innerHTML = '📅 TIME';
            } else if (currentSortOrder === 'createdTime desc') {
                currentSortOrder = 'quotaBytesUsed desc'; 
                btn.innerHTML = '💾 SIZE';
            } else {
                currentSortOrder = 'name'; 
                btn.innerHTML = '🔤 A-Z';
            }
            reloadFolder(); 
        }

        function getActiveFolderId() {
            if (activeFolderKey === 'source') return FOLDERS['source'];
            if (activeFolderKey === 'manter') return FOLDERS[3];
            if (activeFolderKey === 'top') return FOLDERS[5];
            return FOLDERS['source']; 
        }

        async function fetchTotalCount() {
            let count = 0;
            let pageToken = null;
            const currentId = getActiveFolderId();
            const query = `'${currentId}' in parents and mimeType contains 'image/' and trashed = false`;
            const countDisplay = document.getElementById('photo-count');
            countDisplay.innerText = "...";
            
            try {
                do {
                    const response = await gapi.client.drive.files.list({
                        q: query, pageSize: 1000, fields: 'nextPageToken, files(id)', 
                        pageToken: pageToken, orderBy: currentSortOrder 
                    });
                    if (response.result.files) count += response.result.files.length;
                    pageToken = response.result.nextPageToken;
                } while (pageToken);
                
                totalPhotosInFolder = count;
                updateCounterDisplay();
            } catch (e) { countDisplay.innerText = "?"; }
        }

        function updateCounterDisplay() { document.getElementById('photo-count').innerText = totalPhotosInFolder; }

        async function listPhotos() {
            if (isFetching) return;
            isFetching = true;
            document.getElementById('end-screen').style.display = 'none';

            const currentId = getActiveFolderId();
            const query = `'${currentId}' in parents and mimeType contains 'image/' and trashed = false`;
            const requestParams = {
                'pageSize': 100, 
                'fields': 'nextPageToken, files(id, thumbnailLink, parents)', 
                'q': query,
                'orderBy': currentSortOrder 
            };

            if (nextPageToken) requestParams.pageToken = nextPageToken;
            
            try {
                const response = await gapi.client.drive.files.list(requestParams);
                nextPageToken = response.result.nextPageToken || null;
                addCardsToStack(response.result.files);
            } catch (e) { console.error("Error fetching:", e); } 
            finally { isFetching = false; }
        }

        function addCardsToStack(files) {
            const container = document.getElementById('catalog-container');
            const endScreen = document.getElementById('end-screen');

            if (!files || files.length === 0) { 
                if (getVisibleCards().length === 0) endScreen.style.display = 'flex';
                return; 
            }

            let addedCount = 0;
            files.forEach((file) => {
                if (processedIds.has(file.id)) return;
                processedIds.add(file.id);
                addedCount++;

                const card = createCardElement(file.id, file.thumbnailLink.replace('=s220', '=s800'));
                container.appendChild(card);
            });

            updateCardsVisibility();

            if (addedCount === 0 && getVisibleCards().length === 0) {
                if (nextPageToken) listPhotos();
                else endScreen.style.display = 'flex';
            }
        }

        function createCardElement(fileId, imgUrl) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.fileId = fileId; 
            card.innerHTML = `<img src="${imgUrl}">`;
            return card;
        }

        function handleGlobalAction(targetRating) {
            const activeCard = getActiveCard();
            if (!activeCard) return;
            const fileId = activeCard.dataset.fileId;
            
            let x = 0, y = 0;
            if (targetRating === 1) { x = -500; y = 100; } 
            else { x = 500; y = 100; } 
            
            let targetFolderId = FOLDERS[targetRating];
            if (activeFolderKey === 'manter' && targetRating === 3) targetFolderId = FOLDERS['source'];
            if (activeFolderKey === 'top' && targetRating === 5) targetFolderId = FOLDERS['source'];

            animateOut(activeCard, fileId, targetFolderId, x, y);
        }

       function animateOut(el, fileId, targetFolderId, x, y) {
            el.classList.add('animating'); 
            el.style.transform = `translate(${x}px, ${y}px) rotate(${x/15}deg)`;
            el.style.opacity = '0';
            const imgUrl = el.querySelector('img').src;
            const originFolderId = getActiveFolderId(); 
            
            updateCardsVisibility(); 
            if (totalPhotosInFolder > 0) totalPhotosInFolder--;
            updateCounterDisplay();

            actionHistory.push({ fileId: fileId, destination: targetFolderId, origin: originFolderId, imgUrl: imgUrl });
            updateUndoButtonState();

            setTimeout(() => {
                el.remove();
                checkAndFetchMore();
            }, 200);

            if (targetFolderId !== originFolderId) {
                gapi.client.drive.files.update({
                    fileId: fileId, 
                    addParents: targetFolderId, 
                    removeParents: originFolderId,
                    fields: 'id' 
                }).then(function(response) {
                    console.log("Arquivo movido no Drive com sucesso!", response);
                }).catch(function(e) {
                    console.error("Erro na API ao mover a imagem:", e);
                });
            }
        }

        async function undoLastAction() {
            if (actionHistory.length === 0) return;
            const lastAction = actionHistory.pop();
            updateUndoButtonState();

            if (lastAction.origin === getActiveFolderId()) {
                totalPhotosInFolder++;
                updateCounterDisplay();
                
                processedIds.delete(lastAction.fileId);
                document.getElementById('end-screen').style.display = 'none';

                const container = document.getElementById('catalog-container');
                const card = createCardElement(lastAction.fileId, lastAction.imgUrl);
                
                card.style.transform = 'translateY(-100px) scale(0.9)'; 
                card.style.opacity = '0';
                
                const activeCard = getActiveCard();
                if (activeCard) {
                    container.insertBefore(card, activeCard);
                } else {
                    container.appendChild(card);
                }

                updateCardsVisibility();
                void card.offsetWidth;
            
                card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease';
                card.style.transform = 'translateY(0) scale(1)';
                card.style.opacity = '1';
            } 

            gapi.client.drive.files.update({
                fileId: lastAction.fileId, 
                addParents: lastAction.origin, 
                removeParents: lastAction.destination,
                fields: 'id'
            }).then(function(response) {
                console.log("Ação desfeita no Drive!", response);
            }).catch(function(e) {
                console.error("Erro na API de Undo:", e);
            });
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undo_button');
            undoBtn.style.visibility = (actionHistory.length > 0) ? 'visible' : 'hidden';
        }

        function checkAndFetchMore() {
            const remainingCards = getVisibleCards().length;
            if (remainingCards <= 50 && nextPageToken) listPhotos();
            else if (remainingCards === 0 && !nextPageToken) {
                document.getElementById('end-screen').style.display = 'flex';
            }
        }

        function reloadFolder() {
            loadActiveFolder();
        }

        async function emptyRejectFolder() {
            const rejectFolderId = FOLDERS[1];
            let pageToken = null;
            const query = `'${rejectFolderId}' in parents and trashed = false`;
            const trashBtn = document.getElementById('tab-trash');
            const originalText = trashBtn.innerHTML;
            let deletedCount = 0; 
            
            try {
                trashBtn.innerHTML = "⏳";
                trashBtn.disabled = true;
                trashBtn.style.opacity = "0.5";

                do {
                    const response = await gapi.client.drive.files.list({
                        q: query,
                        fields: 'nextPageToken, files(id)',
                        pageToken: pageToken
                    });
                    
                    const files = response.result.files;
                    if (files && files.length > 0) {
                        deletedCount += files.length; 
                        const deletePromises = files.map(file => 
                            gapi.client.drive.files.update({
                                fileId: file.id,
                                resource: { trashed: true }                            
                            })
                        );
                        await Promise.all(deletePromises);
                    }
                    pageToken = response.result.nextPageToken;
                } while (pageToken);

                if (deletedCount > 0) {
                    alert(`${deletedCount} arquivo(s) enviado(s) para a lixeira com sucesso.`);
                } else {
                    alert("A pasta Reject já estava vazia.");
                }

            } catch (e) {
                console.error("Erro ao esvaziar a pasta Reject:", e);
                alert("Ocorreu um erro ao tentar esvaziar a pasta.");
            } finally {
                trashBtn.innerHTML = originalText;
                trashBtn.disabled = false;
                trashBtn.style.opacity = "1";
            }
        }

        function openCuradoriaModal() {
            document.getElementById('confirm-checkbox').checked = false;
            toggleConfirmButton();
            document.getElementById('curadoria-modal').style.display = 'flex';
        }

        function closeCuradoriaModal() {
            document.getElementById('curadoria-modal').style.display = 'none';
        }

        function toggleConfirmButton() {
            const isChecked = document.getElementById('confirm-checkbox').checked;
            const btnConfirm = document.getElementById('btn-confirm-delete');
            
            if (isChecked) {
                btnConfirm.disabled = false;
                btnConfirm.classList.add('enabled');
            } else {
                btnConfirm.disabled = true;
                btnConfirm.classList.remove('enabled');
            }
        }

        async function executeEmptyCuradoria() {
            closeCuradoriaModal(); 
            
            const curadoriaFolderId = FOLDERS['source'];
            let pageToken = null;
            const query = `'${curadoriaFolderId}' in parents and trashed = false`;
            
            const btn = document.getElementById('btn-empty-curadoria');
            const originalText = btn.innerHTML;
            
            let deletedCount = 0; 
            
            try {
                btn.innerHTML = "⏳ APAGANDO...";
                btn.disabled = true;
                btn.style.opacity = "0.5";

                do {
                    const response = await gapi.client.drive.files.list({
                        q: query,
                        fields: 'nextPageToken, files(id)',
                        pageToken: pageToken,
                        pageSize: 100 
                    });
                    
                    const files = response.result.files;
                    if (files && files.length > 0) {
                        deletedCount += files.length; 

                        const deletePromises = files.map(file => 
                            gapi.client.drive.files.update({
                                fileId: file.id,
                                resource: { trashed: true }                            
                            })
                        );
                        await Promise.all(deletePromises);
                    }
                    pageToken = response.result.nextPageToken;
                } while (pageToken);

                if (deletedCount > 0) {
                    alert(`${deletedCount} arquivo(s) da Curadoria enviado(s) para a lixeira do Drive com sucesso.`);
                    if (activeFolderKey === 'source') {
                        reloadFolder(); 
                    }
                } else {
                    alert("A pasta Curadoria já estava vazia.");
                }

            } catch (e) {
                console.error("Erro ao esvaziar a pasta Curadoria:", e);
                alert("Ocorreu um erro ao tentar esvaziar a pasta da Origem.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
