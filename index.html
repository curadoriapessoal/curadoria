<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Editing Pro</title>
    <meta charset="utf-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#070707">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Barlow+Condensed:wght@400;500;600;700&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" onload="initTokenClient()" async defer></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>
    
    <style>
        /* ===================================================
           TOKENS DE DESIGN (PROPOSTA CLAUDE)
           =================================================== */
        :root {
            --bg:           #070707;
            --surface:      #0f0f0f;
            --surface-2:    #161616;
            --surface-3:    #1e1e1e;
            --border:       rgba(255, 255, 255, 0.06);
            --border-mid:   rgba(255, 255, 255, 0.10);
            --border-hi:    rgba(255, 255, 255, 0.18);
            --text:         #e8e8e8;
            --text-dim:     #666;
            --text-muted:   #333;
            --gold:         #c2994a;
            --gold-glow:    rgba(194, 153, 74, 0.12);
            --reject:       #c94444;
            --reject-glow:  rgba(201, 68,  68,  0.10);
            --manter:       #3d7ec4;
            --manter-glow:  rgba(61,  126, 196, 0.10);
            --top:          #3aaa72;
            --top-glow:     rgba(58,  170, 114, 0.10);
            --r-sm:   8px;
            --r-md:   12px;
            --r-lg:   18px;
            --r-pill: 50px;
            --font-serif:  'Playfair Display', Georgia, serif;
            --font-ui:     'Barlow Condensed', Arial Narrow, sans-serif;
            --font-mono:   'DM Mono', 'Courier New', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            font-family: var(--font-ui);
            padding-top: 2vh;
        }

        /* ===================================================
           TELA DE LOGIN
           =================================================== */
        #auth_button {
            padding: 15px 52px;
            background: transparent;
            border: 1px solid var(--border-mid);
            border-radius: var(--r-pill);
            font-family: var(--font-ui);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text);
            cursor: pointer;
            margin-top: 33vh;
            position: relative;
            z-index: 999999;
            transition: all 0.2s ease;
        }
        #auth_button:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-glow); }

        /* ===================================================
           BARRA DE PASTAS
           =================================================== */
        #folder-nav {
            width: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 8px 10px 2px;
            z-index: 1001;
        }

        .folder-tab {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid transparent;
            padding: 7px 13px;
            border-radius: var(--r-sm);
            font-family: var(--font-ui);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .folder-tab.active {
            color: var(--text);
            background: var(--surface-2);
            border-color: var(--border-mid);
        }

        /* ===================================================
           ESTILO DA IMAGEM E CONTAINER
           =================================================== */
        #info-bar { width: 100%; display: flex; justify-content: center; align-items: baseline; z-index: 1000; pointer-events: none; }
        #photo-count { font-family: var(--font-serif); font-size: 2.6rem; color: var(--text); display: none; line-height: 1; }
        #filename-display { width: 100%; text-align: center; font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-muted); margin-top: 5px; }

        #catalog-container {
            position: relative;
            width: 86vw;
            height: 50vh;
            margin-top: 10px;
            display: none;
            margin-left: auto;
            margin-right: auto;
        }

        @media screen and (min-width: 951px) {
            #catalog-container { width: 80vw; max-width: 920px; height: calc(100dvh - 230px); }
            .card img { max-width: 800px !important; max-height: 800px !important; }
        }

        .card {
            position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
        }
        .card img {
            max-width: 100%; max-height: 100%; border-radius: var(--r-md);
            box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 24px 64px rgba(0,0,0,0.5);
        }

        /* ===================================================
           CONTROLES INFERIORES
           =================================================== */
        #bottom-area { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 999999; padding-bottom: env(safe-area-inset-bottom, 0px); pointer-events: none; }
        #controls-wrapper { display: none; flex-direction: column; gap: 8px; padding: 0 10px 8px; position: relative; }

        .left-panel { display: flex; flex-direction: row; gap: 8px; pointer-events: auto; }
        .right-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; pointer-events: auto; width: 100%; }

        #undo-zone { position: absolute; right: 10px; bottom: calc(8px + 64px + 8px); pointer-events: auto; }

        .solid-btn {
            background: var(--surface); border: 1px solid var(--border); color: var(--text);
            font-family: var(--font-ui); font-weight: 700; font-size: 0.72rem; text-transform: uppercase;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
        }
        .btn-left-stack { height: 44px; padding: 0 16px; border-radius: var(--r-sm); }
        .btn-right-action { height: 64px; border-radius: var(--r-md); flex-direction: column; gap: 4px; }
        .btn-right-action .icon { font-size: 1.2rem; }
        .btn-undo { border-color: rgba(194, 153, 74, 0.2); color: var(--gold); visibility: hidden; }

        /* Ocultar Texto em Mobile */
        @media screen and (max-width: 950px) {
            .btn-text { display: none !important; }
            .btn-left-stack, #undo_button { width: 54px !important; height: 54px !important; font-size: 1.3rem !important; }
            .btn-right-action { height: 66px; }
        }
    </style>
</head>
<body>

    <button id="auth_button" onclick="handleAuthClick()">Abrir Pasta</button>

    <div id="folder-nav">
        <button class="folder-tab btn-trash" onclick="emptyRejectFolder()" id="tab-trash">🗑️</button>
        <button class="folder-tab active" onclick="switchFolder('source')" id="tab-source">📥 <span class="btn-text">Origem</span></button>
        <button class="folder-tab" onclick="switchFolder('manter')" id="tab-manter">📁 <span class="btn-text">Manter</span></button>
        <button class="folder-tab" onclick="switchFolder('top')" id="tab-top">🏳️ <span class="btn-text">Top</span></button>
        <button id="btn-sort" class="folder-tab" onclick="toggleSortOrder()">🔤 <span class="btn-text">A-Z</span></button>
    </div>
    
    <div id="info-bar"><div id="photo-count">...</div></div>
    <div id="filename-display"></div>

    <div id="catalog-container">
        <div id="end-screen"><div id="empty-message">A pasta está vazia.</div></div>
    </div>

    <div id="bottom-area">
        <div id="controls-wrapper">
            <div class="left-panel">
                <div id="danger-zone">
                    <button id="btn-reorder" class="solid-btn btn-left-stack" onclick="openReorderModal()">🔀 <span class="btn-text">Reorder</span></button>
                </div>
                <button class="solid-btn btn-left-stack btn-sync" onclick="reloadFolder()">🔄 <span class="btn-text">Sincronizar</span></button>
            </div>
            <div id="undo-zone">
                <button id="undo_button" class="solid-btn btn-undo" onclick="undoLastAction()">↩</button>
            </div>
            <div class="right-panel">
                <button class="solid-btn btn-right-action btn-reject" onclick="handleGlobalAction(1)">
                    <span class="icon">🏴</span><span class="btn-text">Reject</span>
                </button>
                <button class="solid-btn btn-right-action btn-manter" onclick="handleGlobalAction(3)">
                    <span class="icon">📁</span><span class="btn-text">Manter</span>
                </button>
                <button class="solid-btn btn-right-action btn-top" onclick="handleGlobalAction(5)">
                    <span class="icon">🏳️</span><span class="btn-text">Top</span>
                </button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // LÓGICA FUNCIONAL RESTAURADA DO INDEX 1
        const CLIENT_ID = '905891014579-fjgqvkgbiucl4c0asn68pbv1p5gm6ofn.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive';
        const FOLDERS = { 'source': '1l5c1yWkNJWI3NIKp_6Fnxs56nzc44P6F', 1: '1UL8zEJGWWH2A1NEt-pUhRDQ9sTj9KI6w', 3: '1HDf3BCTUulwYA_IdF2AlTmZcy_TyO19x', 5: '1uHGn2rpZJj68QSe0EVJNh8JCXl7oiKoh' };

        let activeFolderKey = 'source', tokenClient, gapiInited = false, gsisInited = false, nextPageToken = null, isFetching = false;
        const processedIds = new Set();
        let actionHistory = [], totalPhotosInFolder = 0, currentViewIndex = 0;

        function gapiLoaded() {
            gapi.load('client', () => {
                gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] }).then(() => { gapiInited = true; });
            });
        }
        function initTokenClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' });
            gsisInited = true;
        }
        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error) return;
                document.getElementById('auth_button').style.display = 'none';
                document.getElementById('folder-nav').style.display = 'flex';
                document.getElementById('catalog-container').style.display = 'block';
                document.getElementById('controls-wrapper').style.display = 'flex';
                document.getElementById('photo-count').style.display = 'block';
                loadActiveFolder();
            };
            tokenClient.requestAccessToken();
        }

        // Funções de carregamento e interface
        function loadActiveFolder() {
            const container = document.getElementById('catalog-container');
            container.querySelectorAll('.card').forEach(c => c.remove());
            nextPageToken = null; currentViewIndex = 0; processedIds.clear();
            document.getElementById('end-screen').style.display = 'none';
            fetchTotalCount(); listPhotos();
        }

        async function listPhotos() {
            if (isFetching) return;
            isFetching = true;
            const query = `'${FOLDERS[activeFolderKey] || FOLDERS.source}' in parents and mimeType contains 'image/' and trashed = false`;
            try {
                const res = await gapi.client.drive.files.list({ pageSize: 100, fields: 'nextPageToken, files(id, name, thumbnailLink)', q: query, pageToken: nextPageToken });
                nextPageToken = res.result.nextPageToken;
                res.result.files.forEach(file => {
                    if (processedIds.has(file.id)) return;
                    processedIds.add(file.id);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.fileId = file.id;
                    card.dataset.fileName = file.name;
                    card.innerHTML = `<img src="${file.thumbnailLink.replace('=s220', '=s800')}">`;
                    document.getElementById('catalog-container').appendChild(card);
                });
                updateCardsVisibility();
            } finally { isFetching = false; }
        }

        function updateCardsVisibility() {
            const cards = Array.from(document.querySelectorAll('.card:not(.animating)'));
            if (cards.length === 0) { document.getElementById('end-screen').style.display = 'flex'; return; }
            cards.forEach((c, i) => {
                c.style.visibility = (i === currentViewIndex) ? 'visible' : 'hidden';
                c.style.opacity = (i === currentViewIndex) ? '1' : '0';
                if (i === currentViewIndex) document.getElementById('filename-display').innerText = c.dataset.fileName;
            });
            document.getElementById('photo-count').innerText = totalPhotosInFolder;
        }

        function handleGlobalAction(rating) {
            const cards = Array.from(document.querySelectorAll('.card:not(.animating)'));
            const active = cards[currentViewIndex];
            if (!active) return;
            active.classList.add('animating');
            active.style.transform = rating === 1 ? 'translateX(-500px) rotate(-20deg)' : 'translateX(500px) rotate(20deg)';
            active.style.opacity = '0';
            totalPhotosInFolder--;
            gapi.client.drive.files.update({ fileId: active.dataset.fileId, addParents: FOLDERS[rating], removeParents: FOLDERS[activeFolderKey] || FOLDERS.source });
            setTimeout(() => { active.remove(); updateCardsVisibility(); }, 200);
        }

        async function fetchTotalCount() {
            const query = `'${FOLDERS[activeFolderKey] || FOLDERS.source}' in parents and mimeType contains 'image/' and trashed = false`;
            const res = await gapi.client.drive.files.list({ q: query, fields: 'files(id)' });
            totalPhotosInFolder = res.result.files.length;
            document.getElementById('photo-count').innerText = totalPhotosInFolder;
        }

        function switchFolder(key) {
            document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + key).classList.add('active');
            activeFolderKey = key;
            loadActiveFolder();
        }
    </script>
</body>
</html>
