<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Editing Pro</title>
    <meta charset="utf-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://accounts.google.com/gsi/client" onload="initTokenClient()" async defer></script>
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()" async defer></script>
    
    <style>
        /* ===================================================
           ESTILOS GERAIS E LAYOUT VERTICAL (PORTRAIT/DESKTOP)
           =================================================== */
        
        /* O body ocupa 100% da tela e impede rolagem (scroll) para manter o aspecto de aplicativo nativo */
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            height: 100vh;
            width: 100vw;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-top: 2vh; 
        }
        
        /* Botão inicial de Login do Google */
        #auth_button { 
            padding: 20px 40px; 
            background: #fff; 
            border: none;
            border-radius: 50px; 
            font-weight: bold;
            cursor: pointer;
            color: #000;
            box-shadow: 0 6px 0 #ccc, 0 10px 15px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            text-transform: uppercase;
            margin-top: 30vh; 
            position: relative;
            z-index: 999999;
        }
        #auth_button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #ccc, 0 4px 6px rgba(0,0,0,0.5);
        }

        /* Barra de navegação superior (Abas das Pastas) */
        #folder-nav {
            width: 100%;
            display: none; 
            justify-content: center;
            align-items: center; 
            gap: 6px; 
            padding: 5px 10px;
            z-index: 1001;
            flex-wrap: wrap; 
            box-sizing: border-box;
        }

        /* Estilo padrão das abas do menu */
        .folder-tab {
            background: #222;
            color: #888;
            border: 1px solid #444;
            padding: 8px 12px; 
            border-radius: 20px;
            font-size: 0.75rem; 
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            white-space: nowrap; 
        }

        /* Aba atualmente selecionada ganha destaque branco */
        .folder-tab.active {
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Estilo específico e de alerta para o botão da lixeira */
        .btn-trash {
            background: transparent;
            border-color: rgba(220, 53, 69, 0.5); 
            font-size: 1rem;
            padding: 5px 10px;
        }
        .btn-trash:hover {
            background: rgba(220, 53, 69, 0.2);
            border-color: #dc3545;
        }

        /* Container do texto que conta quantas fotos restam */
        #info-bar {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center; 
            padding: 5px 0;
            z-index: 1000;
            pointer-events: none; /* Deixa o clique vazar por ele */
        }
        #photo-count {
            font-size: 1.2rem; 
            font-weight: bold;
            color: #aaa;
            text-shadow: 0 1px 3px rgba(0,0,0,1);
            display: none; 
        }

        /* Container do texto que exibe o nome original do arquivo RAW/JPG */
        #filename-display {
            width: 100%;
            text-align: center;
            font-size: 0.7rem; 
            font-weight: 300; /* Fonte discreta */
            color: #777;      
            margin-top: 2px;
            min-height: 1rem; 
            z-index: 1000;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Adiciona '...' se for grande demais */
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* O palco onde a foto fica posicionada e animada */
        #catalog-container { 
            position: relative; 
            width: 95vw; 
            height: 65vh; 
            margin-top: 1vh; 
            display: none;
            transition: opacity 0.3s ease; 
        }
        @media (min-width: 768px) {
            #catalog-container { width: 50vw; } /* Em telas maiores, limita a largura */
        }

        /* O "cartão" da foto em si */
        .card { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: transparent; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out; 
        }
        .card img { 
            max-width: 100%; 
            max-height: 100%; 
            width: auto;
            height: auto;
            object-fit: contain; /* Garante que a foto não seja esticada ou cortada */
            pointer-events: none;
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
        }

        /* Zonas gigantes e invisíveis nas laterais da tela para passar foto com o toque (Mobile Vertical) */
        .nav-zone {
            position: absolute;
            top: 0; bottom: 0;
            width: 35%; 
            display: none; 
            align-items: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 500000; 
            transition: background 0.2s ease, color 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #nav-left { left: 0; justify-content: flex-start; padding-left: 15px; background: linear-gradient(to right, rgba(0,0,0,0.3), transparent); }
        #nav-right { right: 0; justify-content: flex-end; padding-right: 15px; background: linear-gradient(to left, rgba(0,0,0,0.3), transparent); }
        .nav-zone:active { color: rgba(255,255,255,1); background: rgba(255,255,255,0.1); }

        /* Mensagem de final de fila quando a pasta esvazia */
        #end-screen { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 100%; display: none; flex-direction: column; align-items: center; gap: 20px; z-index: 0; 
        }
        #empty-message { font-size: 1.2rem; color: #888; text-align: center; margin-bottom: 10px; }

        /* ---------------------------------------------------
           BOTÃO REORDER (ZONA DE AÇÃO) E MODAIS DE CONFIRMAÇÃO
           --------------------------------------------------- */
        #danger-zone {
            display: none; 
            position: absolute;
            bottom: 22vh; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
        #btn-reorder {
            background: rgba(13, 110, 253, 0.05); border: 1px solid rgba(13, 110, 253, 0.3);
            color: rgba(13, 110, 253, 0.8); padding: 6px 14px; border-radius: 20px;
            font-size: 0.65rem; font-weight: bold; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: all 0.2s ease;
        }
        #btn-reorder:hover { background: rgba(13, 110, 253, 0.2); color: #0d6efd; border-color: #0d6efd; }

        /* Fundo desfocado dos avisos (Popups) */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 9999999; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        /* Caixa do aviso */
        .modal-content {
            background: #111; border: 1px solid #dc3545; padding: 25px; border-radius: 15px;
            width: 85vw; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(220, 53, 69, 0.3); font-family: sans-serif;
        }
        /* Tema Azul para o Modal de Reorder */
        .modal-content.reorder-theme { border-color: #0d6efd; box-shadow: 0 10px 40px rgba(13, 110, 253, 0.2); }
        .modal-content.reorder-theme h3 { color: #0d6efd; }
        .btn-confirm.reorder-btn { background: #0d6efd; opacity: 1; cursor: pointer; box-shadow: 0 0 15px rgba(13, 110, 253, 0.4); }
        
        .modal-actions { display: flex; gap: 10px; justify-content: space-between; }
        .btn-cancel, .btn-confirm { flex: 1; padding: 12px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .btn-cancel { background: #444; color: #fff; }
        .btn-confirm { background: #dc3545; color: #fff; opacity: 0.4; cursor: not-allowed; transition: all 0.2s;}
        .btn-confirm.enabled { opacity: 1; cursor: pointer; box-shadow: 0 0 15px rgba(220, 53, 69, 0.4); }

        /* ---------------------------------------------------
           PAINÉIS DE BOTÕES INFERIORES (AÇÕES)
           --------------------------------------------------- */
        #bottom-area {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 25px); 
            left: 0; width: 100%; display: flex; flex-direction: column; gap: 15px; 
            z-index: 999999; pointer-events: none; /* Apenas os botões pegam clique */
        }

        #controls-wrapper {
            display: none; justify-content: space-between; align-items: flex-end; padding: 0 10px; pointer-events: none;
        }

        .left-panel { display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .right-panel { display: flex; flex-direction: row; gap: 10px; pointer-events: auto; }

        /* Classes auxiliares para textos dos botões (Serão ocultos no mobile) */
        .btn-text { display: inline; }

        /* Estilo base com efeito 'Glassmorphism' dos botões de ação */
        .solid-btn {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6); color: #fff; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; text-shadow: 0 1px 4px rgba(0,0,0,0.8); display: flex; align-items: center;
            justify-content: center; text-transform: uppercase; touch-action: manipulation;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .solid-btn:active { transform: scale(0.96) translateY(2px); }

        .btn-left-stack { width: 130px; height: 46px; border-radius: 12px; font-size: 0.8rem; letter-spacing: 0.5px; }
        .btn-undo { border-color: rgba(255, 193, 7, 0.2); box-shadow: 0 4px 15px rgba(255, 193, 7, 0.1); visibility: hidden; }
        .btn-sync { border-color: rgba(232, 62, 140, 0.2); box-shadow: 0 4px 15px rgba(232, 62, 140, 0.1); }

        .btn-right-action { width: 65px; height: 104px; flex-direction: column; border-radius: 16px; font-size: 0.65rem; gap: 8px; }
        .btn-right-action .icon { font-size: 1.4rem; }
        .btn-reject { border-color: rgba(220, 53, 69, 0.2); box-shadow: 0 4px 15px rgba(220, 53, 69, 0.1); }
        .btn-manter { border-color: rgba(13, 110, 253, 0.2); box-shadow: 0 4px 15px rgba(13, 110, 253, 0.1); }
        .btn-top { border-color: rgba(40, 167, 69, 0.2); box-shadow: 0 4px 15px rgba(40, 167, 69, 0.1); }

        /* Botão para apagar a tela contra inatividade ou pra ver a imagem crua */
        #hide-strip { display: none; justify-content: center; width: 100%; pointer-events: none; }
        #hide-btn { 
            background: rgba(128, 128, 128, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 10px 25px; border-radius: 25px; 
            font-size: 0.8rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            pointer-events: auto; text-transform: uppercase; 
        }

        /* Oculta por padrão os botões do layout Landscape para não aparecerem na tela em pé */
        .landscape-only { display: none; }

        /* ===================================================
           MODO RESPONSIVO: MOBILE GERAL (Retrato e Paisagem)
           Esconde os textos, permitindo botões compactos e quadrados
           =================================================== */
        @media screen and (max-width: 950px) {
            /* Oculta todos os textos envoltos em .btn-text */
            .btn-text { display: none !important; }

            /* Força formato quadrado para botões inferiores (Sync, Voltar, Ações, Reorder, Olho) */
            .btn-left-stack, .btn-right-action, #hide-btn, #btn-reorder {
                width: 60px !important;
                height: 60px !important;
                border-radius: 16px;
                padding: 0 !important;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.6rem !important; /* Ícones maiores para compensar a falta de texto */
                flex-direction: row !important; /* Desativa a coluna (column) das ações da direita */
            }

            /* Reseta a margem dos ícones internos */
            .btn-right-action .icon { font-size: 1.6rem; margin: 0; }

            /* Ajusta abas da pasta do topo/lateral para ficarem mais curtas e com fontes maiores */
            .folder-tab {
                font-size: 1.3rem !important;
                padding: 12px 0 !important;
                border-radius: 14px;
            }
        }

        /* ===================================================
           MODO RESPONSIVO: LANDSCAPE (CELULAR DEITADO)
           Usa a lógica do D-Pad na esquerda e libera o centro.
           =================================================== */
        @media screen and (max-width: 950px) and (orientation: landscape),
               screen and (max-height: 600px) and (orientation: landscape) {
            
            body { padding-top: 0; }

            /* Exibe as setas de imagem e o botão de Sync exclusivo para o grid lateral */
            .landscape-only { display: block; }

            /* TEXTOS INFORMATIVOS (Contador/Nome): Movidos para a extrema DIREITA (Topo) */
            #info-bar { 
                position: fixed; top: 15px; right: 5%; left: auto;
                transform: none; width: auto; z-index: 1002; justify-content: flex-end;
            }
            #filename-display { 
                position: fixed; top: 40px; right: 5%; left: auto;
                transform: none; width: 40vw; z-index: 1002; text-align: right; padding: 0;
            }

            /* ÁREA DA IMAGEM: Centro livre, 85% de altura, desce 10vh pra escapar dos textos */
            #catalog-container {
                width: 40vw; 
                height: 85vh; 
                margin-top: 1vh; 
                margin-bottom: 1vh;
                margin-left: auto; margin-right: auto;
            }

            /* REMOVE AS ZONAS INVISÍVEIS LATERAIS DE TOQUE na foto para evitar esbarrões no celular deitado */
            #nav-left, #nav-right { display: none !important; }

            /* LATERAL ESQUERDA (D-Pad): Abas numa grade de 2 Colunas x 4 Linhas com margem de 5% */
            #folder-nav {
                position: fixed;
                top: 50%;
                left: 2%; 
                transform: translateY(-50%);
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                width: 140px; /* Largura enxuta já que não tem texto */
                background: rgba(0, 0, 0, 0.4);
                border-radius: 15px;
                padding: 8px;
                gap: 10px;
                z-index: 1001;
                margin: 0;
            }
            
            /* ORDEM DO GRID:
               Lixeira (1) - A-Z (2)
               Top (3)     - Manter (4)
               Origem (5)  - Sync (6)
               Seta Esq (7)- Seta Dir (8) */
            #tab-trash          { order: 1; width: 100%; } 
            #btn-sort           { order: 2; width: 100%; } 
            #tab-top            { order: 3; width: 100%; } 
            #tab-manter         { order: 4; width: 100%; } 
            #tab-source         { order: 5; width: 100%; } 
            .btn-sync-landscape { order: 6; width: 100%; } 
            .btn-prev-landscape { order: 7; width: 100%; } 
            .btn-next-landscape { order: 8; width: 100%; } 
            
            .folder-tab { text-align: center; margin: 0; }

            /* Oculta o botão SYNC "antigo" original da barra esquerda para não ter dois na tela */
            .left-panel .btn-sync { display: none !important; }

            /* OCULTAR TELA (Olho): Isolado e fixado no canto inferior DIREITO (Base 5%) */
            #hide-strip {
                position: fixed;
                right: 5%;
                bottom: 5%;
                width: auto;
                z-index: 1000;
                justify-content: flex-end;
                display: flex !important; /* Força exibir */
            }

            /* BOTÕES DE AÇÃO (Reject, Manter, Top): Acima do "Ocultar Tela" */
            .right-panel {
                position: fixed;
                right: 5%;
                bottom: calc(5% + 75px); /* Salta o olho (60px + 15px de gap) */
                flex-direction: row;
                gap: 10px;
                z-index: 1000;
            }

            /* REORDER (ZONA DE PERIGO): Acima do grupo de ações (Top, Manter), alinhado à direita */
            #danger-zone {
                position: fixed;
                right: 5%;
                bottom: calc(5% + 150px); /* Salta o olho e o grupo de ações */
                left: auto;
                transform: none;
                z-index: 1000;
                display: flex;
            }

            /* BOTÃO VOLTAR (UNDO): Removido da esquerda para morar exatamente à esquerda do Reorder */
            .left-panel {
                position: fixed;
                right: calc(5% + 72px); /* Pula a largura (60px) + gap (12px) do Reorder */
                bottom: calc(5% + 150px); /* Mesma altura (linha) do Reorder */
                left: auto;
                flex-direction: column;
                z-index: 1000;
            }
        }
    </style>
</head>
<body>

    <button id="auth_button" onclick="handleAuthClick()">ABRIR PASTA</button>

    <div id="folder-nav">
        <button class="folder-tab btn-trash" onclick="emptyRejectFolder()" id="tab-trash" title="Esvaziar pasta Reject (Atalho: G ou 3)">🗑️</button>
        
        <button class="folder-tab active" onclick="switchFolder('source')" id="tab-source" title="Atalho: 7">📥 <span class="btn-text">Origem</span></button>
        <button class="folder-tab" onclick="switchFolder('manter')" id="tab-manter" title="Atalho: 8">📁 <span class="btn-text">Manter</span></button>
        <button class="folder-tab" onclick="switchFolder('top')" id="tab-top" title="Atalho: 9">🏳️ <span class="btn-text">Top</span></button>

        <button id="btn-sort" class="folder-tab" onclick="toggleSortOrder()" title="Atalho: +">🔤 <span class="btn-text">A-Z</span></button>

        <button class="folder-tab landscape-only btn-sync-landscape" onclick="reloadFolder()" title="Atalho: A ou 2">🔄</button>
        <button class="folder-tab landscape-only btn-prev-landscape" onclick="prevPhoto()" title="Atalho: Seta Esquerda">⬅️</button>
        <button class="folder-tab landscape-only btn-next-landscape" onclick="nextPhoto()" title="Atalho: Seta Direita">➡️</button>
    </div>
    
    <div id="info-bar">
        <div id="photo-count">...</div>
    </div>

    <div id="filename-display"></div>

    <div id="catalog-container">
        <div id="nav-left" class="nav-zone" onclick="prevPhoto()" title="Atalho: Seta Esquerda">&#10094;</div>
        <div id="nav-right" class="nav-zone" onclick="nextPhoto()" title="Atalho: Seta Direita">&#10095;</div>

        <div id="end-screen">
            <div id="empty-message">A pasta está vazia!</div>
        </div>
    </div>

    <div id="danger-zone">
        <button id="btn-reorder" onclick="openReorderModal()">🔀 <span class="btn-text">REORDER (50)</span></button>
    </div>

    <div id="reorder-modal" class="modal-overlay">
        <div class="modal-content reorder-theme">
            <h3>🔄 TRANSFERIR FOTOS 🔄</h3>
            <p>Você vai mover <b>50 arquivos</b> da <i>Pasta (1)</i> direto para a <i>Curadoria</i>.</p>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeReorderModal()">CANCELAR</button>
                <button id="btn-confirm-reorder" class="btn-confirm reorder-btn" onclick="executeReorder()">MOVER AGORA</button>
            </div>
        </div>
    </div>
    
    <div id="install-modal" class="modal-overlay">
        <div class="modal-content reorder-theme" style="border-color: #28a745; box-shadow: 0 10px 40px rgba(40, 167, 69, 0.2);">
            <h3 style="color: #28a745;">📱 INSTALAR APP 📱</h3>
            <p style="font-size: 0.9rem; margin-bottom: 20px;">Instale o Editing Pro no seu dispositivo para acesso rápido e em tela cheia.</p>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeInstallModal()">AGORA NÃO</button>
                <button class="btn-confirm enabled" style="background: #28a745; box-shadow: 0 0 15px rgba(40, 167, 69, 0.4);" onclick="triggerInstall()">INSTALAR</button>
            </div>
        </div>
    </div>

    <div id="bottom-area">
        <div id="controls-wrapper">
            <div class="left-panel">
                <button id="undo_button" class="solid-btn btn-left-stack btn-undo" onclick="undoLastAction()" title="Atalho: R ou 1">↩ <span class="btn-text">VOLTAR</span></button>
                <button class="solid-btn btn-left-stack btn-sync" onclick="reloadFolder()" title="Atalho: A ou 2">🔄 <span class="btn-text">SINCRONIZAR</span></button>
            </div>
            
            <div class="right-panel">
                <button class="solid-btn btn-right-action btn-reject" onclick="handleGlobalAction(1)" title="Atalho: S ou 4">
                    <span class="icon">🏴</span> <span class="btn-text">REJECT</span>
                </button>
                <button class="solid-btn btn-right-action btn-manter" onclick="handleGlobalAction(3)" title="Atalho: D ou 5">
                    <span class="icon">📁</span> <span class="btn-text">MANTER</span>
                </button>
                <button class="solid-btn btn-right-action btn-top" onclick="handleGlobalAction(5)" title="Atalho: F ou 6">
                    <span class="icon">🏳️</span> <span class="btn-text">TOP</span>
                </button>
            </div>
        </div>

        <div id="hide-strip">
            <button id="hide-btn" onclick="toggleVisibility()" title="Atalho: 0">👁️ <span class="btn-text">OCULTAR TELA</span></button>
        </div>
    </div>

    <script type="text/javascript">
        // =======================================================
        // CREDENCIAIS E ESTRUTURAS DO GOOGLE DRIVE
        // =======================================================
        const CLIENT_ID = '905891014579-fjgqvkgbiucl4c0asn68pbv1p5gm6ofn.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive'; 
        
        // Mapeamento de IDs das Pastas no Drive (Substitua pelos reais caso crie novas)
        const FOLDERS = {
            'source': '1l5c1yWkNJWI3NIKp_6Fnxs56nzc44P6F',
            1: '1UL8zEJGWWH2A1NEt-pUhRDQ9sTj9KI6w', // Pasta Reject
            3: '1HDf3BCTUulwYA_IdF2AlTmZcy_TyO19x', // Pasta Manter
            5: '1uHGn2rpZJj68QSe0EVJNh8JCXl7oiKoh'  // Pasta Top
        };

        // Estado Global da Aplicação
        let activeFolderKey = 'source'; // Define que a tela inicia na Origem
        let tokenClient;
        let gapiInited = false;
        let gsisInited = false;
        let nextPageToken = null; // Usado para paginação na API do Drive (+ de 100 fotos)
        let isFetching = false; // Trava contra clicks múltiplos simultâneos
        let undoZIndex = 200000; 
        
        const processedIds = new Set(); // Garante que a API não carregue a mesma foto 2x
        let actionHistory = []; // Armazena memória do último movimento para o "Voltar (Undo)"
        let totalPhotosInFolder = 0; // O contador do cabeçalho
        let currentViewIndex = 0; // A foto atual em foco na tela
        let isScreenHidden = false; // Controle da inatividade / Ocultar Tela
        let currentSortOrder = 'name'; // Modo de ordenação: nome, tamanho, etc

        // Variáveis de inatividade e tela preta
        let inactivityTimer = null;
        const INACTIVITY_DELAY = 10000; // 10 segundos ausente = Oculta a tela

        // =======================================================
        // INICIALIZAÇÃO DA API (GAPI E GSI)
        // =======================================================
        function gapiLoaded() { 
            gapi.load('client', () => {
                gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] })
                .then(() => { gapiInited = true; maybeEnableButtons(); })
                .catch(err => console.error("Erro GAPI", err));
            });
        }

        function initTokenClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({ 
                client_id: CLIENT_ID, 
                scope: SCOPES, 
                callback: (resp) => {} 
            });
            gsisInited = true;
            maybeEnableButtons();
        }

        function maybeEnableButtons() {
            if (gapiInited && gsisInited) {
                document.getElementById('auth_button').style.display = 'block'; // Libera o Login
            }
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error) {
                    console.error("Erro na autenticação:", resp);
                    return;
                }
                
                // Autenticou com sucesso, esconde login e mostra toda a interface
                document.getElementById('auth_button').style.display = 'none';
                document.getElementById('folder-nav').style.display = 'flex';
                document.getElementById('catalog-container').style.display = 'block';
                document.getElementById('controls-wrapper').style.display = 'flex'; 
                document.getElementById('hide-strip').style.display = 'flex'; 
                document.getElementById('photo-count').style.display = 'block'; 
                document.getElementById('danger-zone').style.display = 'block'; 
                
                loadActiveFolder();
                resetInactivityTimer(); // Começa a contar inatividade
            };
            tokenClient.requestAccessToken(); 
        }

        // =======================================================
        // SISTEMA DE INATIVIDADE (OCULTAR/EXIBIR TELA)
        // =======================================================
        function hideImageArea() {
            const container = document.getElementById('catalog-container');
            const hideBtn = document.getElementById('hide-btn');
            const hideBtnText = hideBtn.querySelector('.btn-text');
            if (container) {
                isScreenHidden = true;
                container.style.opacity = '0.01'; // Deixa praticamente invisível (protege a tela de burn-in)
                if (hideBtnText) hideBtnText.innerText = 'ATIVAR TELA';
            }
        }

        function showImageArea() {
            const container = document.getElementById('catalog-container');
            const hideBtn = document.getElementById('hide-btn');
            const hideBtnText = hideBtn.querySelector('.btn-text');
            if (container) {
                isScreenHidden = false;
                container.style.opacity = '1';
                if (hideBtnText) hideBtnText.innerText = 'OCULTAR TELA';
            }
        }

        function toggleVisibility() {
            if (isScreenHidden) {
                showImageArea();
                resetInactivityTimer();
            } else {
                hideImageArea();
                clearTimeout(inactivityTimer); 
            }
        }

        function resetInactivityTimer() {
            try {
                clearTimeout(inactivityTimer);
                
                const authBtn = document.getElementById('auth_button');
                // Só arma o timer de 10s se o usuário estiver logado e a tela visível
                if (authBtn && authBtn.style.display === 'none' && !isScreenHidden) {
                    inactivityTimer = setTimeout(hideImageArea, INACTIVITY_DELAY);
                }
            } catch (e) {
                console.error("Erro no temporizador:", e);
            }
        }

        // Fica de olho em movimentos ou toques no celular para manter a tela "acordada"
        window.addEventListener('DOMContentLoaded', () => {
            ['mousemove', 'mousedown', 'touchstart', 'touchmove', 'keydown'].forEach(evt => {
                document.addEventListener(evt, resetInactivityTimer, { passive: true });
            });
        });

        // =======================================================
        // NAVEGAÇÃO ENTRE PASTAS
        // =======================================================
        function switchFolder(folderKey) {
            if (activeFolderKey === folderKey) return; 

            // Troca a cor da aba ativada
            document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + folderKey).classList.add('active');

            activeFolderKey = folderKey;
            
            // Oculta botão Reorder se não estiver na Origem
            document.getElementById('danger-zone').style.display = (folderKey === 'source') ? 'block' : 'none';

            loadActiveFolder();
        }

        function loadActiveFolder() {
            const container = document.getElementById('catalog-container');
            // Remove as fotos velhas da memória visual
            container.querySelectorAll('.card').forEach(c => c.remove());
            
            // Reseta os estados pro zero
            nextPageToken = null; 
            currentViewIndex = 0;
            processedIds.clear();
            actionHistory = []; 
            updateUndoButtonState();
            
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('filename-display').innerText = '';
            fetchTotalCount();
            listPhotos();
        }

        // =======================================================
        // LÓGICA DE EXIBIÇÃO E TROCA DE CARTÕES (FOTOS)
        // =======================================================
        function getVisibleCards() {
            // Ignora os cards que já estão voando pra fora da tela (animating)
            return Array.from(document.querySelectorAll('.card:not(.animating)'));
        }

        function getActiveCard() {
            const cards = getVisibleCards();
            return cards[currentViewIndex] || null;
        }

        function updateCardsVisibility() {
            const cards = getVisibleCards();
            const navLeft = document.getElementById('nav-left');
            const navRight = document.getElementById('nav-right');

            // Se não tem fotos, some tudo
            if(cards.length === 0) {
                navLeft.style.display = 'none';
                navRight.style.display = 'none';
                return;
            }
            
            if (currentViewIndex >= cards.length) currentViewIndex = Math.max(0, cards.length - 1);
            if (currentViewIndex < 0) currentViewIndex = 0;

            // Esconde todas e mostra apenas a do índice atual
            cards.forEach((card, index) => {
                if (index === currentViewIndex) {
                    card.style.visibility = 'visible';
                    card.style.opacity = '1';
                    
                    // Atualiza o display com o nome do arquivo RAW/JPG do card atual
                    const nameDisplay = document.getElementById('filename-display');
                    if (nameDisplay) nameDisplay.innerText = card.dataset.fileName;
                    
                } else {
                    card.style.visibility = 'hidden';
                    card.style.opacity = '0';
                }
            });

            // Lógica das setas laterais (Invisíveis no retrato)
            navLeft.style.display = currentViewIndex > 0 ? 'flex' : 'none';
            navRight.style.display = (currentViewIndex < cards.length - 1 || nextPageToken) ? 'flex' : 'none';
        }

        function prevPhoto() {
            if (currentViewIndex > 0) {
                currentViewIndex--;
                updateCardsVisibility();
            }
        }

        function nextPhoto() {
            const cards = getVisibleCards();
            if (currentViewIndex < cards.length - 1) {
                currentViewIndex++;
                updateCardsVisibility();
            } else if (nextPageToken) {
                listPhotos(); // Chama API pra baixar mais fotos se chegou no final do lote
            }
        }

        // Teclas de atalho para uso no Desktop ou teclado do tablet
        document.addEventListener('keydown', (event) => {
            if (event.repeat) return; 

            switch(event.key) {
                case 'ArrowLeft': prevPhoto(); break;
                case 'ArrowRight': nextPhoto(); break;
                case 's': case 'S': case '4': handleGlobalAction(1); break; 
                case 'd': case 'D': case '5': handleGlobalAction(3); break; 
                case 'f': case 'F': case '6': handleGlobalAction(5); break; 
                case 'a': case 'A': case '2': reloadFolder(); break; 
                case 'r': case 'R': case '1': undoLastAction(); break; 
                case 'g': case 'G': case '3': emptyRejectFolder(); break; 
                case '7': switchFolder('source'); break; 
                case '8': switchFolder('manter'); break; 
                case '9': switchFolder('top'); break;  
                case '+': toggleSortOrder(); break; 
                case '0': toggleVisibility(); break; 
            }
        });

        // Altera o modo como a API do Google joga a lista (Por nome, data ou tamanho)
        function toggleSortOrder() {
            const btn = document.getElementById('btn-sort');
            const textSpan = btn.querySelector('.btn-text');
            if (currentSortOrder === 'name') {
                currentSortOrder = 'createdTime desc'; 
                if (textSpan) textSpan.innerHTML = 'TIME';
            } else if (currentSortOrder === 'createdTime desc') {
                currentSortOrder = 'quotaBytesUsed desc'; 
                if (textSpan) textSpan.innerHTML = 'SIZE';
            } else {
                currentSortOrder = 'name'; 
                if (textSpan) textSpan.innerHTML = 'A-Z';
            }
            reloadFolder(); 
        }

        // =======================================================
        // BUSCANDO ARQUIVOS DA API (GOOGLE DRIVE)
        // =======================================================
        function getActiveFolderId() {
            if (activeFolderKey === 'source') return FOLDERS['source'];
            if (activeFolderKey === 'manter') return FOLDERS[3];
            if (activeFolderKey === 'top') return FOLDERS[5];
            return FOLDERS['source']; 
        }

        async function fetchTotalCount() {
            let count = 0;
            let pageToken = null;
            const currentId = getActiveFolderId();
            const query = `'${currentId}' in parents and mimeType contains 'image/' and trashed = false`;
            const countDisplay = document.getElementById('photo-count');
            countDisplay.innerText = "...";
            
            try {
                // Loop necessário pois o Google só conta até 1000 arquivos de uma vez
                do {
                    const response = await gapi.client.drive.files.list({
                        q: query, pageSize: 1000, fields: 'nextPageToken, files(id)', 
                        pageToken: pageToken, orderBy: currentSortOrder 
                    });
                    if (response.result.files) count += response.result.files.length;
                    pageToken = response.result.nextPageToken;
                } while (pageToken);
                
                totalPhotosInFolder = count;
                updateCounterDisplay();
            } catch (e) { countDisplay.innerText = "?"; }
        }

        function updateCounterDisplay() { document.getElementById('photo-count').innerText = totalPhotosInFolder; }

        // Faz o download das miniaturas (100 por vez)
        async function listPhotos() {
            if (isFetching) return;
            isFetching = true;
            document.getElementById('end-screen').style.display = 'none';

            const currentId = getActiveFolderId();
            const query = `'${currentId}' in parents and mimeType contains 'image/' and trashed = false`;
            const requestParams = {
                'pageSize': 100, 
                // Busca ID, Nome, URL da Imagem e as pastas pais
                'fields': 'nextPageToken, files(id, name, thumbnailLink, parents)', 
                'q': query,
                'orderBy': currentSortOrder 
            };

            if (nextPageToken) requestParams.pageToken = nextPageToken;
            
            try {
                const response = await gapi.client.drive.files.list(requestParams);
                nextPageToken = response.result.nextPageToken || null;
                addCardsToStack(response.result.files);
            } catch (e) { console.error("Error fetching:", e); } 
            finally { isFetching = false; }
        }

        function addCardsToStack(files) {
            const container = document.getElementById('catalog-container');
            const endScreen = document.getElementById('end-screen');

            if (!files || files.length === 0) { 
                if (getVisibleCards().length === 0) endScreen.style.display = 'flex';
                return; 
            }

            let addedCount = 0;
            files.forEach((file) => {
                if (processedIds.has(file.id)) return;
                processedIds.add(file.id);
                addedCount++;

                // O macete =s800 no link do Google aumenta a resolução da foto na tela de 220px para 800px
                const card = createCardElement(file.id, file.thumbnailLink.replace('=s220', '=s800'), file.name);                
                container.appendChild(card);
            });

            updateCardsVisibility();

            // Se filtrou arquivos que já estavam em tela, baixa mais 100 da fila
            if (addedCount === 0 && getVisibleCards().length === 0) {
                if (nextPageToken) listPhotos();
                else endScreen.style.display = 'flex';
            }
        }

        function createCardElement(fileId, imgUrl, fileName) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.fileId = fileId; 
            card.dataset.fileName = fileName || 'Desconhecido'; // Guarda o nome RAW/JPG na memória do DOM
            card.innerHTML = `<img src="${imgUrl}">`;
            return card;
        }

        // =======================================================
        // CLASSIFICAÇÃO: ENVIANDO PARA REJECT, MANTER E TOP
        // =======================================================
        function handleGlobalAction(targetRating) {
            const activeCard = getActiveCard();
            if (!activeCard) return;
            const fileId = activeCard.dataset.fileId;
            
            // X dita pra qual lado a animação joga a foto na tela
            let x = 0, y = 0;
            if (targetRating === 1) { x = -500; y = 100; } // Reject voa pra esquerda
            else { x = 500; y = 100; } // Manter/Top voam pra direita
            
            let targetFolderId = FOLDERS[targetRating];
            // Bloqueio de redundância: se já ta no Manter, mandar manter o envia de volta à Origem (Revert)
            if (activeFolderKey === 'manter' && targetRating === 3) targetFolderId = FOLDERS['source'];
            if (activeFolderKey === 'top' && targetRating === 5) targetFolderId = FOLDERS['source'];

            animateOut(activeCard, fileId, targetFolderId, x, y);
        }

       function animateOut(el, fileId, targetFolderId, x, y) {
            el.classList.add('animating'); // Impede que o mouse toque no card de novo
            el.style.transform = `translate(${x}px, ${y}px) rotate(${x/15}deg)`;
            el.style.opacity = '0';
            const imgUrl = el.querySelector('img').src;
            const originFolderId = getActiveFolderId(); 
            
            updateCardsVisibility(); // Chama a próxima foto pro meio da tela
            if (totalPhotosInFolder > 0) totalPhotosInFolder--; // Diminui o contador do alto
            updateCounterDisplay();

            // Salva na memória RAM local pra se você apertar o UNDO
            actionHistory.push({ fileId: fileId, destination: targetFolderId, origin: originFolderId, imgUrl: imgUrl });
            updateUndoButtonState();

            // Depois da animação visual, deleta o card HTML
            setTimeout(() => {
                el.remove();
                checkAndFetchMore();
            }, 200);

            // A chamada REAL que move a foto no servidor do Drive (Assíncrona para não travar a sua tela)
            if (targetFolderId !== originFolderId) {
                gapi.client.drive.files.update({
                    fileId: fileId, 
                    addParents: targetFolderId, 
                    removeParents: originFolderId,
                    fields: 'id' 
                }).then(function(response) {
                    console.log("Arquivo movido no Drive com sucesso!", response);
                }).catch(function(e) {
                    console.error("Erro na API ao mover a imagem:", e);
                });
            }
        }

        // =======================================================
        // DESFAZER AÇÃO (UNDO)
        // =======================================================
        async function undoLastAction() {
            if (actionHistory.length === 0) return;
            const lastAction = actionHistory.pop(); // Tira do histórico
            updateUndoButtonState();

            // Se o arquivo veio da pasta atual (ex: ele era Origem e você mandou pro Reject estando na Origem)
            if (lastAction.origin === getActiveFolderId()) {
                totalPhotosInFolder++; // Devolve o contador
                updateCounterDisplay();
                
                processedIds.delete(lastAction.fileId); // Permite processar ele de novo
                document.getElementById('end-screen').style.display = 'none';

                const container = document.getElementById('catalog-container');
                // Recria a foto. Usamos o histórico pra recuperar imagem e um nome fixo porque a API apagou o metadado local
                const card = createCardElement(lastAction.fileId, lastAction.imgUrl, "AÇÃO DESFEITA");
                
                // Anima ela caindo do teto da tela
                card.style.transform = 'translateY(-100px) scale(0.9)'; 
                card.style.opacity = '0';
                
                const activeCard = getActiveCard();
                if (activeCard) {
                    container.insertBefore(card, activeCard);
                } else {
                    container.appendChild(card);
                }

                updateCardsVisibility();
                void card.offsetWidth; // Força re-renderização do navegador pra que a animação corra fluida
            
                card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease';
                card.style.transform = 'translateY(0) scale(1)';
                card.style.opacity = '1';
            } 

            // Desfaz a movimentação no servidor Google
            gapi.client.drive.files.update({
                fileId: lastAction.fileId, 
                addParents: lastAction.origin, 
                removeParents: lastAction.destination,
                fields: 'id'
            }).then(function(response) {
                console.log("Ação desfeita no Drive!", response);
            }).catch(function(e) {
                console.error("Erro na API de Undo:", e);
            });
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undo_button');
            undoBtn.style.visibility = (actionHistory.length > 0) ? 'visible' : 'hidden'; // Oculta se não tem o que desfazer
        }

        // Controle para manter a pilha de imagens sempre abastecida (se sobrar 50 na tela, baixa mais 100)
        function checkAndFetchMore() {
            const remainingCards = getVisibleCards().length;
            if (remainingCards <= 50 && nextPageToken) listPhotos();
            else if (remainingCards === 0 && !nextPageToken) {
                document.getElementById('end-screen').style.display = 'flex';
            }
        }

        // Força zerar a tela toda e baixar de novo da API
        function reloadFolder() {
            loadActiveFolder();
        }

        // =======================================================
        // LÓGICA DE LIMPEZA DE LIXEIRA (DESTRUTIVA)
        // =======================================================
        async function emptyRejectFolder() {
            const rejectFolderId = FOLDERS[1];
            let pageToken = null;
            const query = `'${rejectFolderId}' in parents and trashed = false`;
            const trashBtn = document.getElementById('tab-trash');
            const originalText = trashBtn.innerHTML;
            let deletedCount = 0; 
            
            try {
                trashBtn.innerHTML = "⏳";
                trashBtn.disabled = true;
                trashBtn.style.opacity = "0.5";

                // 1. Move os arquivos da sua pasta virtual "Reject" para a lixeira embutida do Google Drive
                do {
                    const response = await gapi.client.drive.files.list({
                        q: query,
                        fields: 'nextPageToken, files(id)',
                        pageToken: pageToken
                    });
                    
                    const files = response.result.files;
                    if (files && files.length > 0) {
                        deletedCount += files.length; 
                        const deletePromises = files.map(file => 
                            gapi.client.drive.files.update({
                                fileId: file.id,
                                resource: { trashed: true }                            
                            })
                        );
                        await Promise.all(deletePromises); // Espera lixar lote
                    }
                    pageToken = response.result.nextPageToken;
                } while (pageToken);

                // 2. Comanda o Google Drive a esvaziar TODA a lixeira da sua conta permanentemente!
                trashBtn.innerHTML = "🔥"; 
                await gapi.client.drive.files.emptyTrash({});

                if (deletedCount > 0) {
                    alert(`${deletedCount} arquivo(s) rejeitado(s). A Lixeira do Google Drive foi completamente esvaziada.`);
                } else {
                    alert("A pasta Reject já estava vazia. A Lixeira do Google Drive foi esvaziada com sucesso.");
                }

            } catch (e) {
                console.error("Erro ao esvaziar a pasta Reject ou a Lixeira:", e);
                alert("Ocorreu um erro ao tentar limpar os arquivos.");
            } finally {
                trashBtn.innerHTML = originalText;
                trashBtn.disabled = false;
                trashBtn.style.opacity = "1";
            }
        }

        // =======================================================
        // LÓGICA DE TRANSFERÊNCIA DE 50 ARQUIVOS (REORDER)
        // =======================================================
        function openReorderModal() { document.getElementById('reorder-modal').style.display = 'flex'; }
        function closeReorderModal() { document.getElementById('reorder-modal').style.display = 'none'; }

        async function executeReorder() {
            closeReorderModal(); 
            
            const sourceFolderId = '19UxvEpWqcM931B0AKbjy1NT1Y_vqO0p6'; // Link da Pasta (1) que fará a injeção
            const destFolderId = FOLDERS['source']; // Recebedor: _CURADORIA
            const limit = 50; // Quantidade de fotos por batelada
            
            const btn = document.getElementById('btn-reorder');
            const originalText = btn.innerHTML;
            let pageToken = null;
            const query = `'${sourceFolderId}' in parents and mimeType contains 'image/' and trashed = false`;
            let filesToMove = [];
            
            try {
                btn.innerHTML = "⏳";
                btn.disabled = true;
                btn.style.opacity = "0.5";

                // 1. Vasculha a pasta 1 atrás das 50 fotos
                do {
                    const response = await gapi.client.drive.files.list({
                        q: query,
                        fields: 'nextPageToken, files(id)',
                        pageToken: pageToken,
                        pageSize: 100 
                    });
                    
                    const files = response.result.files;
                    if (files && files.length > 0) {
                        for (let file of files) {
                            if (filesToMove.length < limit) {
                                filesToMove.push(file);
                            }
                        }
                    }
                    pageToken = response.result.nextPageToken;
                } while (pageToken && filesToMove.length < limit);

                if (filesToMove.length === 0) {
                    alert("A Pasta (1) está vazia! Nenhuma foto para mover.");
                    return;
                }

                // 2. Realoca de 25 em 25 (Chunking) para a API não bloquear a conexão por Span
                const chunkSize = 25; 
                for (let i = 0; i < filesToMove.length; i += chunkSize) {
                    const chunk = filesToMove.slice(i, i + chunkSize);
                    
                    const movePromises = chunk.map(file => 
                        gapi.client.drive.files.update({
                            fileId: file.id,
                            addParents: destFolderId,
                            removeParents: sourceFolderId,
                            fields: 'id'
                        })
                    );
                    
                    btn.innerHTML = `⏳ ${Math.min(i + chunkSize, filesToMove.length)}/${filesToMove.length}`;
                    await Promise.all(movePromises); 
                }

                alert(`${filesToMove.length} arquivo(s) transferido(s) para a Curadoria com sucesso!`);
                
                // Se sua tela atual for a de Origem, atualiza os cards para você poder julgá-las imediatamente
                if (activeFolderKey === 'source') {
                    reloadFolder(); 
                }

            } catch (e) {
                console.error("Erro ao transferir arquivos:", e);
                alert("Ocorreu um erro na transferência entre as pastas.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }

        // =======================================================
        // INSTALAÇÃO DO APP NATIVO VIA POPUP (PWA)
        // =======================================================
        let deferredPrompt;

        // Fica observando o navegador informar que o app tem suporte para ser instalado
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); // Esconde as abinhas chatas automáticas do Chrome
            deferredPrompt = e; // Põe o "convite" num gatilho
            
            // Ativa o nosso modal estilizado
            document.getElementById('install-modal').style.display = 'flex';
        });

        function closeInstallModal() {
            document.getElementById('install-modal').style.display = 'none';
        }

        // Aciona o card real do Android/iOS caso a pessoa aceite
        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('App instalado pelo usuário!');
                }
                
                deferredPrompt = null;
                closeInstallModal();
            }
        }

        // Retira os avisos de instalação se você rodar por dentro do App Instalado
        window.addEventListener('appinstalled', () => {
            closeInstallModal();
            deferredPrompt = null;
        });

        // Habilita a memória em Cache Offline para o app inicializar mais rápido depois do 1º acesso
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registrado com sucesso! Escopo:', registration.scope);
                }).catch(error => {
                    console.log('Falha no registro do ServiceWorker:', error);
                });
            });
        }
    </script>
